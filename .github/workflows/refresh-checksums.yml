name: Refresh release checksums

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1.1
  push:
    paths:
      - .github/workflows/refresh-checksums.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'v0.1.1' }}
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'skillguard-*' --dir release-assets --clobber
          (cd release-assets && sha256sum skillguard-* > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt
          gh release upload "$TAG" release-assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
