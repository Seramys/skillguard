name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: ubuntu-latest
          - os: windows-latest
            name: windows-latest
          # Keep the check name "test (macos-latest)" stable for branch protection,
          # but run on an x64 macOS runner to avoid arm64 runner capacity failures.
          - os: macos-15-intel
            name: macos-latest
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash scripts/package-python.sh
      - run: bash scripts/package-npm.sh
      - run: node packages/npm/bin/skillguard.js --version
      - run: cd packages/python && python -m pip install -e . && skillguard --version