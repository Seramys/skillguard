<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">SkillGuard</title>
  <desc id="desc">A browser-style card containing a scan frame, a periwinkle shield with a check mark, and a teal scanning beam.</desc>
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1F2A44" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- browser card -->
  <rect x="140" y="140" width="744" height="744" rx="44" fill="#FBFDFF" stroke="#1F2A44" stroke-width="10" filter="url(#cardShadow)"/>
  <line x1="140" y1="232" x2="884" y2="232" stroke="#1F2A44" stroke-width="8" opacity="0.9"/>
  <circle cx="200" cy="186" r="12" fill="#FF7AA2"/>
  <circle cx="242" cy="186" r="12" fill="#FFD05B"/>
  <circle cx="284" cy="186" r="12" fill="#4ED6A1"/>

  <!-- scan frame -->
  <g fill="none" stroke="#1F2A44" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path d="M290 400 L290 340 Q290 320 310 320 L370 320"/>
    <path d="M654 320 L714 320 Q734 320 734 340 L734 400"/>
    <path d="M290 640 L290 700 Q290 720 310 720 L370 720"/>
    <path d="M654 720 L714 720 Q734 720 734 700 L734 640"/>
  </g>

  <!-- scanning beam -->
  <line x1="190" y1="520" x2="834" y2="520" stroke="#35D3B2" stroke-width="8" stroke-linecap="round" stroke-dasharray="28 18"/>

  <!-- shield -->
  <path d="M512 398 C548 418 584 426 612 430 L612 520 C612 582 570 622 512 648 C454 622 412 582 412 520 L412 430 C440 426 476 418 512 398 Z"
        fill="none" stroke="#FBFDFF" stroke-width="20" stroke-linejoin="round"/>
  <path d="M512 398 C548 418 584 426 612 430 L612 520 C612 582 570 622 512 648 C454 622 412 582 412 520 L412 430 C440 426 476 418 512 398 Z"
        fill="#8B7CF6" stroke="#6A5AE0" stroke-width="8" stroke-linejoin="round"/>
  <path d="M468 520 L500 552 L562 478" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sparkle -->
  <path d="M800 304 C804 326 814 336 836 340 C814 344 804 354 800 376 C796 354 786 344 764 340 C786 336 796 326 800 304 Z" fill="#8B7CF6"/>
</svg>
