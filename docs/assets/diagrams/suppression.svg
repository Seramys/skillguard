rif" font-size="11.5" font-weight="400" fill="#1F2A44" text-anchor="start" opacity="1" letter-spacing="0">适合全仓统一策略</text><path d="M 364 400 L 386 400" fill="none" stroke="#7C9CFF" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrowBlue)"/><rect x="390" y="196" width="290" height="410" rx="20" fill="#FFFFFF" stroke="#E2E9F8" stroke-width="1.2" opacity="1" filter="url(#cardShadow)"/><rect x="410" y="216" width="44" height="26" rx="13.0" fill="#F3EEFF"/><text x="432.0" y="232.96" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="800" fill="#8B7CF6" text-anchor="middle" opacity="1" letter-spacing="0">02</text><text x="468" y="236" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="800" fill="#1F2A44" text-anchor="start" opacity="1" letter-spacing="0">文件级</text><text x="410" y="276" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#6B7A99" text-anchor="start" opacity="1" letter-spacing="0">文件头注释</text><rect x="404" y="298" width="262" height="122" rx="14" fill="#0B1224" stroke="#223052" stroke-width="1" opacity="1"/><text x="420" y="322" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="10.0" fill="#C7D2E8">&lt;!-- skillguard-disable-file</text><text x="420" y="341" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="10.0" fill="#C7D2E8">     SG-HYG-003 --&gt;</text><text x="410" y="454" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="800" fill="#8A97B2" text-anchor="start" opacity="1" letter-spacing="0">作用范围</text><text x="410" y="478" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#1F2A44" text-anchor="start" opacity="1" letter-spacing="0">单个文件 / 单个规则</text><text x="410" y="514" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="800" fill="#8A97B2" text-anchor="start" opacity="1" letter-spacing="0">适用</text><text x="410" y="538" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="400" fill="#1F2A44" text-anchor="start" opacity="1" letter-spacing="0">适合单个 Skill 的已知例外</text><path d="M 684 400 L 706 400" fill="none" stroke="#7C9CFF" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrowBlue)"/><rect x="710" y="196" width="290" height="410" rx="20" fill="#FFFFFF" stroke="#E2E9F8" stroke-width="1.2" opacity="1" filter="url(#cardShadow)"/><rect x="730" y="216" width="44" height="26" rx="13.0" fill="#E9FBF3"/><text x="752.0" y="232.96" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="800" fill="#17A673" text-anchor="middle" opacity="1" letter-spacing="0">03</text><text x="788" y="236" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="800" fill="#1F2A44" text-anchor="start" opacity="1" letter-spacing="0">行级</text><text x="730" y="276" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#6B7A99" text-anchor="start" opacity="1" letter-spacing="0">行内 / 下一行</text><rect x="724" y="298" width="262" height="122" rx="14" fill="#0B1224" stroke="#223052" stroke-width="1" opacity="1"/><text x="740" y="322" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="10.0" fill="#C7D2E8" textLength="230" lengthAdjust="spacingAndGlyphs"># skillguard-disable-next-line SG-CMD-001</text><text x="740" y="341" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="10.0" fill="#C7D2E8">rm -rf /tmp/old-build</text><text x="730" y="454" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="800" fill="#8A97B2" text-anchor="start" opacity="1" letter-spacing="0">作用范围</text><text x="730" y="478" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-siz