ll="#8A97B2" text-anchor="start" opacity="1" letter-spacing="0">作用范围</text><text x="1050" y="478" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#1F2A44" text-anchor="start" opacity="1" letter-spacing="0">本次运行 / 项目配置</text><text x="1050" y="514" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="800" fill="#8A97B2" text-anchor="start" opacity="1" letter-spacing="0">适用</text><text x="1050" y="538" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="400" fill="#1F2A44" text-anchor="start" opacity="1" letter-spacing="0">适合临时排查，不写入文件</text><rect x="70" y="636" width="1260" height="82" rx="18" fill="#FBFDFF" stroke="#DDE6F8" stroke-width="1.2" opacity="1"/><text x="94" y="668" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="800" fill="#5B6CFF" text-anchor="start" opacity="1" letter-spacing="0">推荐做法</text><text x="94" y="694" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#6B7A99" text-anchor="start" opacity="1" letter-spacing="0">先修问题，再抑制；抑制时写明规则 ID 与原因。不要用 * 掩盖整类风险，除非你确认该规则在该项目中不适用。</text></svg>
