pacity="1" letter-spacing="0">read</text><text x="716" y="680" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#5B6CFF" text-anchor="start" opacity="1" letter-spacing="0">compile</text><text x="1156" y="680" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#17A673" text-anchor="start" opacity="1" letter-spacing="0">emit</text><text x="70" y="882" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="400" fill="#8A97B2" text-anchor="start" opacity="1" letter-spacing="0">安全边界：不执行被扫描代码 · 不联网 · 不跟随符号链接 · 目录深度 32 · 最多 1000 个 Skill / 5000 个文件 · 单文件内容上限 512 KB</text></svg>
