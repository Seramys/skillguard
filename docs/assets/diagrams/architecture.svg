tart" opacity="1" letter-spacing="0">JSON for tooling</text><text x="1035" y="530" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="400" fill="#6B7A99" text-anchor="start" opacity="1" letter-spacing="0">SARIF 2.1.0</text><rect x="70" y="704" width="380" height="132" rx="20" fill="#FFFFFF" stroke="#E2E9F8" stroke-width="1.2" opacity="1" filter="url(#cardShadow)"/><text x="92" y="738" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="800" fill="#1F2A44" text-anchor="start" opacity="1" letter-spacing="0">Skill / collection</text><text x="92" y="765" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="400" fill="#6B7A99" text-anchor="start" opacity="1" letter-spacing="0">SKILL.md + scripts + configs</text><text x="92" y="789" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#8A97B2" text-anchor="start" opacity="1" letter-spacing="0">recursive discovery · exclude aware</text><rect x="360" y="720" width="68" height="24" rx="12.0" fill="#EAF0FF"/><text x="394.0" y="735.6" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="800" fill="#5B6CFF" text-anchor="middle" opacity="1" letter-spacing="0">input</text><rect x="510" y="704" width="380" height="132" rx="20" fill="#FFFFFF" stroke="#E2E9F8" stroke-width="1.2" opacity="1" filter="url(#cardShadow)"/><text x="532" y="738" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="800" fill="#1F2A44" text-anchor="start" opacity="1" letter-spacing="0">Rule pack</text><text x="532" y="765" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="400" fill="#6B7A99" text-anchor="start" opacity="1" letter-spacing="0">rules/core.json  ·  29 rules</text><text x="532" y="789" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" 