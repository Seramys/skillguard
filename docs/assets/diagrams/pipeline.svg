<text x="70" y="62" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="800" fill="#8A97B2" text-anchor="start" opacity="1" letter-spacing="2.2">SCAN PIPELINE</text>
<text x="70" y="108" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="38" font-weight="800" fill="#1F2A44" text-anchor="start" opacity="1" letter-spacing="-0.6">一次扫描，七步完成</text>
<text x="70" y="143" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="16.5" font-weight="400" fill="#6B7A99" text-anchor="start" opacity="1" letter-spacing="0">从目录发现到结构化报告，所有步骤都在本地完成；不会执行被扫描代码。</text>
<circle cx="100" cy="230" r="24" fill="#7C9CFF" opacity="0.14"/><text x="100" y="237" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="800" fill="#7C9CFF" text-anchor="middle" opacity="1" letter-spacing="0">1</text><line x1="100" y1="258" x2="100" y2="298" stroke="#D7E1F4" stroke-width="2.5" stroke-dasharray="5 6"/><rect x="160" y="196" width="960" height="92" rx="20" fill="#FFFFFF" stroke="#E2E9F8" stroke-width="1.2" opacity="1" filter="url(#cardShadow)"/><text x="184" y="230" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="800" fill="#1F2A44" text-anchor="start" opacity="1" letter-spacing="0">发现 Skill</text><text x="184" y="257" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.8" font-weight="400" fill="#6B7A99" text-anchor="start" opacity="1" letter-spacing="0">递归查找包含 SKILL.md 的目录；也支持单文件或 Skill 集合。</text><rect x="948" y="222" width="148" height="26" rx="13.0" fill="#F4F7FF"/><text x="1022.0" y="238.6" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="800" fill="#5B6CFF" text-anchor="middle" opacity="1" letter-spacing="0">find_skill_roots()</text><circle cx="100" cy="342" r="24" fill="#8B7CF6" opacity="0.14"/><text x="100" y="349" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="800" fill="#8B7CF6" text-anchor="middle" opacity="1" letter-spacing="0">2</text><line x1="100" y1="370" x2="100" y2="410" stroke="#D7E1F4" stroke-width="2.5" stroke-dasharray="5 6"/><rect x="160" y="308" width="960" height="92" rx="20" fill="#FFFFFF" stroke="#E2E9F8" stroke-width="1.2" opacity="1" filter="url(#cardShadow)"/><text x="184" y="342" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="800" fill="#1F2A44" text-anchor="start" opacity="1" letter-spacing="0">解析 frontmatter</text><text x="184" y="369" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.8" font-weight="400" fill="#6B7A99" text-anchor="start" opacity="1" letter-spacing="0">读取 name、description、version、allowed-tools 等元数据。</text><rect x="948" y="334" width="148" height="26" rx="13.0" fill="#F4F7FF"/><text x="1022.0" y="350.6" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="800" fill="#5B6CFF" text-anchor="middle" opacity="1" letter-spacing="0">frontmatter::parse()</text><circle cx="100" cy="454" r="24" fill="#35D3B2" opacity="0.14"/><text x="100" y="461" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="800" fill="#35D3B2" text-anchor="middle" opacity="1" letter-spacing="0">3</text><line x1="100" y1="482" x2="100" y2="522" stroke="#D7E1F4" stroke-width="2.5" stroke-dasharray="5 6"/><rect x="160" y="420" width="960" height="92" rx="20" fill="#FFFFFF" stroke="#E2E9F8" stroke-width="1.2" opacity="1" filter="url(#cardShadow)"/><text x="184" y="454" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="800" fill="#1F2A44" text-anchor="start" opacity="1" letter-spacing="0">分类文件</text><text x="184" y="481" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.8" font-weight="400" fill="#6B7A99" text-anchor="start" opacity="1" letter-spacing="0">markdown / script / config / text / binary；二进制只做路径规则。</text><rect x="948" y="446" width="148" height="26" rx="13.0" fill="#F4F7FF"/><text x="1022.0" y="462.6" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="800" fill="#5B6CFF" text-anchor="middle" opacity="1" letter-spacing="0">classify_scope()</text><circle cx="100" cy="566" r="24" fill="#FFB454" opacity="0.14"/><text x="100" y="573" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="800" fill="#FFB454" text-anchor="middle" opacity="1" letter-spacing="0">4</text><line x1="100" y1="594" x2="100" y2="634" stroke="#D7E1F4" stroke-width="2.5" stroke-dasharray="5 6"/><rect x="160" y="532" width="960" height="92" rx="20" fill="#FFFFFF" stroke="#E2E9F8" stroke-width="1.2" opacity="1" filter="url(#cardShadow)"/><text x="184" y="566" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="800" fill="#1F2A44" text-anchor="start" opacity="1" letter-spacing="0">运行规则</text><text x="184" y="593" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.8" font-weight="400" fill="#6B7A99" text-anchor="start" opacity="1" letter-spacing="0">29 条内置规则：regex、路径、熵、隐藏字符、Base64、frontmatter。</text><rect x="948" y="558" width="148" height="26" rx="13.0" fill="#F4F7FF"/><text x="1022.0" y="574.6" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="800" fill="#5B6CFF" text-anchor="middle" opacity="1" letter-spacing="0">rules/core.json</text><circle cx="100" cy="678" r="24" fill="#FF7AA2" opacity="0.14"/><text x="100" y="685" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="800" fill="#FF7AA2" text-anchor="middle" opacity="1" letter-spacing="0">5</text><line x1="100" y1="706" x2="100" y2="746" stroke="#D7E1F4" stroke-width="2.5" stroke-dasharray="5 6"/><rect x="160" y="644" width="960" height="92" rx="20" fill="#FFFFFF" stroke="#E2E9F8" stroke-width="1.2" opacity="1" filter="url(#cardShadow)"/><text x="184" y="678" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="800" fill="#1F2A44" text-anchor="start" opacity="1" letter-spacing="0">组合信号</text><text x="184" y="705" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.8" font-weight="400" fill="#6B7A99" text-anchor="start" opacity="1" letter-spacing="0">同一 Skill 内跨文件关联：敏感访问 + 外联；注入 + 远程执行。</text><rect x="948" y="670" width="148" height="26" rx="13.0" fill="#F4F7FF"/><text x="1022.0" y="686.6" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="800" fill="#5B6CFF" text-anchor="middle" opacity="1" letter-spacing="0">SG-COMBO-001/002</text><circle cx="100" cy="790" r="24" fill="#7C9CFF" opacity="0.14"/><text x="100" y="797" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="800" fill="#7C9CFF" text-anchor="middle" opacity="1" letter-spacing="0">6</text><line x1="100" y1="818" x2="100" y2="858" stroke="#D7E1F4" stroke-width="2.5" stroke-dasharray="5 6"/><rect x="160" y="756" width="960" height="92" rx="20" fill="#FFFFFF" stroke="#E2E9F8" stroke-width="1.2" opacity="1" filter="url(#cardShadow)"/><text x="184" y="790" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="800" fill="#1F2A44" text-anchor="start" opacity="1" letter-spacing="0">应用抑制</text><text x="184" y="817" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.8" font-weight="400" fill="#6B7A99" text-anchor="start" opacity="1" letter-spacing="0">项目 ignore、文件头、行级注释、CLI/config；精确到规则。</text><rect x="948" y="782" width="148" height="26" rx="13.0" fill="#F4F7FF"/><text x="1022.0" y="798.6" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="800" fill="#5B6CFF" text-anchor="middle" opacity="1" letter-spacing="0">skillguard-disable-*</text><circle cx="100" cy="902" r="24" fill="#17A673" opacity="0.14"/><text x="100" y="909" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="800" fill="#17A673" text-anchor="middle" opacity="1" letter-spacing="0">7</text><rect x="160" y="868" width="960" height="92" rx="20" fill="#FFFFFF" stroke="#E2E9F8" stroke-width="1.2" opacity="1" filter="url(#cardShadow)"/><text x="184" y="902" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="800" fill="#1F2A44" text-anchor="start" opacity="1" letter-spacing="0">输出报告</text><text x="184" y="929" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.8" font-weight="400" fill="#6B7A99" text-anchor="start" opacity="1" letter-spacing="0">text / JSON / SARIF 2.1.0；退出码 0 / 1 / 2。</text><rect x="948" y="894" width="148" height="26" rx="13.0" fill="#F4F7FF"/><text x="1022.0" y="910.6" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="800" fill="#5B6CFF" text-anchor="middle" opacity="1" letter-spacing="0">text · json · sarif</text><text x="70" y="986" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="400" fill="#8A97B2" text-anchor="start" opacity="1" letter-spacing="0">只读扫描 · 不执行代码 · 不发起网络请求 · 不在本地落盘修改被扫描文件</text></svg>
