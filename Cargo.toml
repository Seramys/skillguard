[package]
name = "skillguard"
version = "0.1.1"
edition = "2021"
description = "Supply-chain security scanner for AI agent skills"
license = "MIT"
repository = "https://github.com/Seramys/skillguard"
keywords = ["ai", "agent", "skills", "security", "supply-chain"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true